spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/bi_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      database: 3
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5s
      password: ${REDIS_PASSWORD:}
server:
  port: 8101

mybatis-plus:
  configuration:
    log-impl: ''

springdoc:
  api-docs:
    enabled: true
