spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: bi-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/bi_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      database: 3
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis only backs the rate limiter, a sub-millisecond script; when it does not answer quickly the limiter
      # falls back to this instance (RedisRateLimitManager), so do not keep a request waiting for it.
      timeout: 500ms
      connect-timeout: 500ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Make publishing verifiable: the broker confirms every message it has taken responsibility for (confirm),
    # and hands back any message no queue was bound to receive (returns + mandatory) instead of dropping it.
    # BiMessageProducer waits for both before treating a publish as successful.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        # Each consumer thread holds one AI call for up to bi.ai.read-timeout, so one slow call no longer
        # blocks every other job. Kept small: the container has 1 GB and the AI provider rate-limits.
        concurrency: 3
        max-concurrency: 3
        # Deliver one unacknowledged message per consumer at a time. With the default (250) a busy consumer
        # hoards queued jobs that idle consumers could have processed.
        prefetch: 1
  servlet:
    multipart:
      max-file-size: 10MB

server:
  address: 0.0.0.0
  port: 8101
  servlet:
    context-path: /api
    session:
      timeout: 30d
      cookie:
        max-age: 30d

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        # Only health is public. Other actuator endpoints can leak configuration and internals.
        include: health
  endpoint:
    health:
      # Report UP/DOWN only; component details (hosts, versions) stay private.
      show-details: never
  health:
    redis:
      # Redis is optional (the rate limiter falls back without it), so its outage must not report the whole backend
      # DOWN: deploy.sh would roll back a healthy release, and the rollback would fail the same check.
      enabled: false

springdoc:
  api-docs:
    enabled: true
  packages-to-scan: com.zachary.BI.controller
  swagger-ui:
    path: /swagger-ui.html

bi:
  ai:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-v4-flash
    connect-timeout: PT10S
    # Total time allowed for one AI call, including reading the whole response body.
    # Must stay well below bi.analysis.recovery.stale-running-after, otherwise the recovery task
    # could reclaim a job whose worker is still legitimately waiting for the provider.
    read-timeout: PT3M

  analysis:
    limits:
      # Analyses queued, running or retrying at once (each is a paid AI call and a slot in the shared queue).
      # Over either limit, submitting returns 42900. An identical submission still reuses its active job.
      max-active-jobs-per-user: 5
      max-active-jobs: 200
    parsing:
      # Spreadsheets parsed at once on this instance (each holds up to ~50 MB of heap); each user gets one at a time.
      # A request waits this long for a free slot, then gets 42900 "server is busy".
      max-concurrent: 2
      acquire-timeout: PT10S
    retry:
      # Wait before each retry of a failed analysis (one retry per entry, strictly increasing), plus up to
      # jitter x delay at random. 400/401/402/403/404/413/422 from the provider are not retried at all.
      # The longest delay x (1 + jitter) must stay below recovery.stale-pending-after (checked at startup).
      delays: [PT30S, PT2M, PT5M]
      jitter: 0.2
    recovery:
      # Scheduled safety net for jobs stuck in running/queued/retrying (see AnalysisJobRecoveryTask).
      enabled: true
      interval: PT1M
      stale-running-after: PT10M
      stale-pending-after: PT10M
      batch-size: 100

  upload:
    # Private server directory for incomplete chunk uploads.
    staging-directory: ${UPLOAD_STAGING_DIRECTORY:./data/uploads}

    # The total file-size limit for resumable uploads: 25 MB.
    max-file-size-bytes: 26214400

    # Every non-final frontend chunk must be 5 MB.
    chunk-size-bytes: 5242880

    # Unfinished uploads expire after 24 hours.
    session-ttl-hours: 24

    # Merged files can be analysed for 7 days; afterwards the cleanup task deletes them.
    completed-retention-hours: 168

    # A completion that has not finished after 10 minutes is assumed to belong to a crashed process.
    completion-lease-minutes: 10

    cleanup:
      # Scheduled housekeeping for upload sessions and staging files (see UploadCleanupTask).
      enabled: true
      interval: PT15M
